<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 2 recupero debito | 6 - Temporizzazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5 d-flex flex-column">
        <h3 class="fw-bold mb-3">Timer conto alla rovescia</h3>

        <label for="secondi-input">Inserisci i secondi:</label>
        <input type="number" id="secondi-input" class="mb-2">

        <div class="schermo-container">
            <p id="schermo">00</p>
        </div>

        <div class="controlli mt-2">
            <button class="btn btn-success" onclick="avviaTimer()">Avvia</button>
            <button class="btn btn-danger" onclick="fermaTimer()">Ferma</button>
            <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
        </div>

        <p id="messaggio" class="mt-3 fw-bold"></p>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
