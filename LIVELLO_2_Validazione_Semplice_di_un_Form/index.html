<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 2 recupero debito | 2 - Condizioni e controlli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5 d-flex d-flex flex-column">
        <h2 class="fw-bold">Completa questo form</h2>
        <form id="mio-form">
            <div class="mb-3">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="il tuo nome" required>
            </div>

            <div class="mb-3">
                <label for="cognome">Cognome:</label>
                <input type="text" id="cognome" name="cognome" class="form-control" placeholder="il tuo cognome" required>
            </div>

            <div class="mb-3">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="email@esempio.com" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Telefono:</label>
                <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="numero di telefono" required>
            </div>

            <div class="mb-3">
                <label for="messaggio"class="form-label">Messaggio:</label>
                <textarea name="messaggio" id="messaggio" class="form-control" rows="4"
                    placeholder="scrivi il tuo messaggio" required></textarea>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="privacy" name="privacy" class="form-check-input">
                <label for="privacy" class="form-check-label">Accetta il trattamento dei dati personali</label>

            </div>
            <button type="button" id="btn-invia" class="btn btn-primary" onclick="convalidaForm()">Invia</button>
            <p id="risultato" class="mt-3"></p>
        </form>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
